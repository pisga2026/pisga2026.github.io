<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תוכנית פסגה – תוכן עניינים</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background: #f7f8fa;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 20px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .logo {
      width: 170px;
      max-width: 40%;
      height: auto;
      display: block;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.3rem);
      line-height: 1.2;
    }
    section {
      padding: 22px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }
    h2 {
      margin: 0 0 16px;
      font-size: 1.35rem;
    }
    ul {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    a {
      display: block;
      padding: 10px 12px;
      color: #155e75;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover, a:focus-visible {
      background: #f0f9ff;
      border-color: #a5d8e8;
    }
    .summary {
      grid-column: 1 / -1;
      margin-top: 4px;
    }
    .summary a {
      font-weight: 700;
      background: #ecfeff;
      border-color: #a5f3fc;
    }
    @media (max-width: 520px) {
      main { padding: 24px 14px; }
      header { align-items: flex-start; }
      .logo { width: 125px; }
      section { padding: 18px; }
      ul { grid-template-columns: 1fr; }
      .summary { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img
        class="logo"
        src="https://static.wixstatic.com/media/53df7c_69c166fb3de94bf195580e2ef2d51c4a~mv2.png/v1/fill/w_272,h_88,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/%D7%9C%D7%95%D7%92%D7%95%20%D7%97%D7%95%D7%A3%20%D7%94%D7%A9%D7%A8%D7%95%D7%9F.png"
        alt="לוגו בית הספר חוף השרון"
      >
      <h1>תוכנית פסגה – תוכן עניינים</h1>
    </header>

    <section>
      <h2>שיעור 1</h2>
      <ul>
        <li><a href="lesson-1/exercise-1.html">תרגיל 1</a></li>
        <li><a href="lesson-1/exercise-2.html">תרגיל 2</a></li>
        <li><a href="lesson-1/exercise-3.html">תרגיל 3</a></li>
        <li><a href="lesson-1/exercise-4.html">תרגיל 4</a></li>
        <li><a href="lesson-1/exercise-5.html">תרגיל 5</a></li>
        <li class="summary">
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSeKx-q5yI_Lu801rqHGRZEIH_sketJPofAL9HIEB4-YGyf-0Q/viewform">שאלון סיכום והרחבה</a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
